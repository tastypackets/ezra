[package]
name = "ezra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["http2"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
caps = "0.5.6"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4"
nix = { version = "0.31.3", features = ["user", "fs", "process", "hostname", "signal", "resource"] }
notify = "8.2.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "net", "time", "sync", "fs", "process", "io-util"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["axum_extras", "time"] }
x509-parser = "0.18.1"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
