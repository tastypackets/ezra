# Local development: `docker compose -f compose.dev.yaml up -d --build`, then open https://localhost:8443.
# The volumes keep the manager password and agent sign-ins across rebuilds; never add `-v` to `down`.
name: ezra-dev

services:
  ezra:
    build: .
    image: ezra:dev
    hostname: ezra-dev
    ports:
      - "8443:8443"
    volumes:
      - config:/config
      - projects:/projects
    stop_grace_period: 60s

volumes:
  config:
  projects:
