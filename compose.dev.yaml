# Local development: `docker compose -f compose.dev.yaml up -d --build`, then open https://localhost:8443.
# The volumes keep the manager password and agent sign-ins across rebuilds; never add `-v` to `down`.
name: ezra-dev

services:
  ezra:
    build: .
    image: ezra:dev
    hostname: ezra-dev
    ports:
      - "8443:8443"
    volumes:
      - config:/config
      - home:/home/dev
      - cache:/cache
    stop_grace_period: 60s
    # Codex's sandbox needs user namespaces, which Docker's default profiles block. Without these
    # the ChatGPT app's folder picker fails. Remove them if only running Claude Code.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

volumes:
  config:
  home:
  cache:
