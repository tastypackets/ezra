[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "x86_64-unknown-linux-musl" }
node = "26"
pnpm = "12.6.0"

[env]
TANSTACK_CLI_TELEMETRY_DISABLED = "1"

[tasks.generate-schema]
description = "Regenerate the committed openapi.json from the Rust API"
run = "cargo run --locked --quiet -- openapi openapi.json"

[tasks."web:install"]
description = "Install the web workspace dependencies"
dir = "web"
run = "pnpm install --frozen-lockfile"

[tasks."web:skills"]
description = "Copy the TanStack agent skills from the installed packages into .agents/skills"
dir = "web"
run = """
router=$(realpath app/node_modules/@tanstack/react-router)/../router-core/skills/router-core
plugin=$(realpath app/node_modules/@tanstack/router-plugin)/skills/router-plugin
docs=$(realpath node_modules/@tanstack/cli)/skills/query-docs-library-metadata
for skill in "$router" "$plugin" "$docs"; do
  rm -rf "../.agents/skills/$(basename "$skill")"
  cp -r "$skill" ../.agents/skills/
done
"""

[tasks."web:generate"]
description = "Generate the TypeScript API client from openapi.json"
dir = "web"
run = "pnpm generate"

[tasks."web:build"]
description = "Type-check and build the manager web app into web/app/dist"
dir = "web"
run = "pnpm build"

[tasks."web:lint"]
description = "Lint and format-check the web app"
dir = "web"
run = "pnpm lint"

[tasks."web:e2e"]
description = "Run the Playwright tests against the ezra:dev image"
dir = "web"
run = "pnpm test:e2e"
