name: Release

on:
  push:
    branches: [main]
    paths: [crates/ezra/Cargo.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: tastypackets/ezra

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read the version and check it is unreleased
        run: |
          if [[ ${GITHUB_REF} != refs/heads/main ]]; then
            echo "::error::Releases run from main."
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "ezra") | .version')"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}"; then
            if [[ ${GITHUB_EVENT_NAME} == push ]]; then
              echo "v${version} is already released, so this change to crates/ezra/Cargo.toml releases nothing."
              exit 0
            fi
            echo "::error::v${version} is already released. Bump the version in crates/ezra/Cargo.toml first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      EZRA_TEST_IMAGE: ezra:release
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: mise run web:install
      - run: mise run web:lint
      - run: mise run web:test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ezra:release
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Container tests
        run: .github/scripts/container-tests.sh
      - run: pnpm --filter @ezra/e2e exec playwright install --with-deps chromium
        working-directory: web
      - run: mise run web:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.arch }}
          path: web/e2e/test-results
          if-no-files-found: ignore
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag both architectures together
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest" --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  github-release:
    needs: [version, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --generate-notes
