name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: openapi.json is up to date
        run: |
          mise run generate-schema
          git diff --exit-code openapi.json

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run web:install
      - run: mise run web:lint
      - run: mise run web:test
      - run: mise run web:build

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Changes beyond Markdown, and changes that can reach the image
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n ${BASE} ]] && git diff --quiet "${BASE}...HEAD" -- . ':!*.md'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n ${BASE} ]] && git diff --quiet "${BASE}...HEAD" -- \
            crates Cargo.toml Cargo.lock web openapi.json Dockerfile .dockerignore image mise.toml \
            .github/workflows/ci.yml .github/scripts; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EZRA_TEST_IMAGE: ezra:ci
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build a debug ezra binary
        run: |
          sudo apt-get install --yes --no-install-recommends musl-tools
          cargo build --locked --target x86_64-unknown-linux-musl --package ezra
          install -D target/x86_64-unknown-linux-musl/debug/ezra "${RUNNER_TEMP}/ezra-build/out/ezra"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: ezra-build=${{ runner.temp }}/ezra-build
          load: true
          tags: ezra:ci
          cache-from: |
            type=gha
            type=gha,scope=release-amd64
          cache-to: type=gha,mode=max
      - name: Container tests
        run: .github/scripts/container-tests.sh
      - run: mise run web:install
      - run: pnpm --filter @ezra/e2e exec playwright install --with-deps chromium
        working-directory: web
      - run: mise run web:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: web/e2e/test-results
          if-no-files-found: ignore
