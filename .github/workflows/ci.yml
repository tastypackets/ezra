name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: openapi.json is up to date
        run: |
          mise run generate-schema
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run web:install
      - run: mise run web:lint
      - run: mise run web:test
      - run: mise run web:build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EZRA_TEST_IMAGE: ezra:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ezra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - name: Container tests
        # They mount host folders that the container's dev user (uid 1000) writes.
        run: |
          getent passwd 1000 || sudo useradd --uid 1000 --create-home ezra-test
          tester="$(getent passwd 1000 | cut -d: -f1)"
          sudo usermod --append --groups docker "$tester"
          binaries="$(mktemp --directory)"
          cargo test --locked --test '*' --no-run --message-format=json \
            | jq -r 'select(.executable != null and .profile.test) | .executable' \
            | xargs install --mode=755 --target-directory="$binaries"
          chmod 755 "$binaries"
          for tests in "$binaries"/*; do
            sudo --user="$tester" --preserve-env=EZRA_TEST_IMAGE "$tests" --ignored
          done
      - run: mise run web:install
      - run: pnpm --filter @ezra/e2e exec playwright install --with-deps chromium
        working-directory: web
      - run: mise run web:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: web/e2e/test-results
          if-no-files-found: ignore
